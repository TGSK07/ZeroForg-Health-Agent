<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>ZeroForg Health Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>

<body>
  <header>
    <h1>ZeroForg Health Agent</h1>
    <span id="badge" class="badge">…</span>
    <div class="range">
      <button data-range="1h" class="active">Last hour</button>
      <button data-range="24h">Last 24 h</button>
    </div>
  </header>

  <main>
    <section class="charts" id="charts"></section>

    <section>
      <h2>Open alerts</h2>
      <table id="open-alerts"></table>
    </section>
    <section>
      <h2>Closed alerts</h2>
      <table id="closed-alerts"></table>
    </section>
    <section>
      <h2>Top processes (by CPU)</h2>
      <table id="procs"></table>
    </section>
  </main>
  <script src="index.js"></script>
</body>

</html>
